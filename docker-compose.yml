version: '3'
services:
  minio:
    image: docker.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    expose:
      - 9000
      - 9001
    volumes:
      - minio:/data
    networks:
      - proxy
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?Please set the MINIO_PASS environment variable or run setup tool}
      MINIO_BROWSER_REDIRECT_URL: 'http://admin.s3.localhost'
  traefik:
    image: docker.io/caddy:alpine
    ports:
      - '${WEB_PORT:-8778}:80'
    volumes:
      - ./conf:/etc/caddy
    networks:
      - proxy
  db:
    image: docker.io/postgres:18
    restart: unless-stopped
    expose:
      - 5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?Please set the POSTGRES_PASS environment variable or run setup tool}
    volumes:
      - pgdata:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
      - ./conf/initrunner.sh:/docker-entrypoint-initdb.d/initrunner.sh:ro
    networks:
      - proxy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 5s
      retries: 10
  migrate:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      target: migrate
    environment:
      - PGHOST=/var/run/postgresql
      - PGUSER=root
      - PGDATABASE=namepending
    volumes:
      - postgres-socket:/var/run/postgresql
  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    build:
      context: .
      target: api
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PGHOST=/var/run/postgresql
      - PGUSER=root
      - PGDATABASE=namepending
      - APP_SECRET=${APP_SECRET:?Please set the APP_SECRET environment variable or run setup tool}
      - BETTER_AUTH_SECRET=${APP_SECRET:?Please set the APP_SECRET environment variable or run setup tool}
      - BETTER_AUTH_URL=${URL:?Please set the URL environment variable or run setup tool}
      - URL=${URL:?Please set the URL environment variable or run setup tool}
      - NAME=${NAME:-namepending}
    volumes:
      - postgres-socket:/var/run/postgresql
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - URL=${URL:?Please set the URL environment variable or run setup tool}
      - PUBLIC_URL=${URL:?Please set the URL environment variable or run setup tool}
      - NAME=${NAME:-namepending}
      - PUBLIC_NAME=${NAME:-namepending}
volumes:
  minio:
  pgdata:
  postgres-socket:
networks:
  proxy:
